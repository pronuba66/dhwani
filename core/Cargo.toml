[package]
name = "dhwani"
version = "0.1.0"
edition = "2024"
authors = ["Joseph George Stephen <pronuba66@gmail.com>"]
description = "A real-time audio processing engine for DAWs"
license = "MIT OR Apache-2.0"

[[example]]
name = "gui"
required-features = ["controller"]

[features]
default = []
controller = []
debug = ["charming"]

[dev-dependencies]
anyhow = "1.0.102"
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
eframe = "0.34.3"
egui_plot = "0.35.0"
rand = "0.10.1"
tokio = { version = "1.52.3", features = ["full"] }
symphonia = { version = "0.6.0", features = ["wav", "mp3", "mpa"] }

[dependencies]
biquad = "0.6.0"
bitflags = "2.13.0"
charming = { version = "0.6.0", optional = true }
